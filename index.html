<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЦО 11.6.1.3 • Электромагнитная природа света (3D)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { background: #070b14; color: #f1f5f9; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 10px 16px; background: rgba(12, 19, 34, 0.94); border-bottom: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; z-index: 10;
    }
    .title-badge { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .co-tag {
      background: #0284c7; color: #fff; font-weight: 700; font-size: 12px;
      padding: 3px 8px; border-radius: 6px; letter-spacing: 0.3px;
    }
    header h1 { font-size: 15px; font-weight: 600; color: #f8fafc; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b;
      color: #cbd5e1; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 600; }
    #canvas-wrap { position: relative; flex: 1; width: 100%; }
    canvas { display: block; width: 100%; height: 100%; }

    .label-3d {
      position: absolute; transform: translate(-50%, -50%); pointer-events: none;
      background: rgba(15, 23, 42, 0.88); border: 1px solid #475569; color: #f8fafc;
      padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
      white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
    }

    .panel {
      position: absolute; top: 14px; left: 14px; width: 325px; max-width: calc(100vw - 28px);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
      border: 1px solid #334155; border-radius: 12px; padding: 14px; font-size: 13px; line-height: 1.45;
      z-index: 5;
    }
    .stage-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: #38bdf8; font-weight: 700; margin-bottom: 4px; }
    .panel h2 { font-size: 15px; color: #f8fafc; margin-bottom: 6px; }
    .control { margin-top: 10px; }
    .control label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #cbd5e1; }
    .control input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    .formula {
      margin-top: 10px; padding: 8px 10px; background: #090d16; border-left: 3px solid #38bdf8;
      border-radius: 6px; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; color: #e2e8f0;
    }
    .conclusion { margin-top: 10px; color: #94a3b8; font-size: 12.5px; }

    .bottom-bar {
      position: absolute; bottom: 14px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none; z-index: 5;
    }
    .camera-bar, .hint-bar {
      pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      background: rgba(15, 23, 42, 0.88); padding: 6px 10px; border-radius: 10px; border: 1px solid #334155;
      font-size: 12px; color: #cbd5e1;
    }
    .cam-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b;
      color: #e2e8f0; font-size: 12px; cursor: pointer;
    }
    .cam-btn:hover { background: #334155; }
    .err-box {
      max-width: 520px; margin: 40px auto; padding: 18px; border-radius: 12px;
      background: #1e1b2e; border: 1px solid #f43f5e; color: #ffe4e6; font-size: 14px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-badge">
      <span class="co-tag">ЦО 11.6.1.3</span>
      <h1>Экспериментальное доказательство электромагнитной природы света</h1>
    </div>
    <div class="tabs">
      <button class="tab active" data-mode="interference">1. Интерференция</button>
      <button class="tab" data-mode="diffraction">2. Дифракция</button>
      <button class="tab" data-mode="polarization">3. Поляризация</button>
      <button class="tab" data-mode="emwave">4. Волна Максвелла</button>
    </div>
  </header>

  <div id="canvas-wrap">
    <div class="panel" id="info-panel">Загрузка 3D-модели...</div>
    <div id="labels-layer"></div>
    <div class="bottom-bar">
      <div class="camera-bar">
        <span>Камера:</span>
        <button class="cam-btn" onclick="setCam(7.5, 4.2, 8.8)">3D-перспектива</button>
        <button class="cam-btn" onclick="setCam(0, 1.2, 11)">Вид сбоку</button>
        <button class="cam-btn" onclick="setCam(0, 12, 0.1)">Вид сверху</button>
        <button class="cam-btn" onclick="setCam(9.5, 1.5, 0)">Вид на экран</button>
      </div>
      <div class="hint-bar">ЛКМ / 1 палец — вращение • Колёсико — масштаб • ПКМ — сдвиг</div>
    </div>
  </div>

  <script>
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function initThree() {
      const threeUrls = [
        'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
        'https://unpkg.com/three@0.128.0/build/three.min.js'
      ];
      const controlsUrls = [
        'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js',
        'https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js'
      ];

      let loadedThree = false;
      for (const u of threeUrls) {
        try { await loadScript(u); if (window.THREE) { loadedThree = true; break; } } catch (_) {}
      }
      if (!loadedThree) {
        document.getElementById('canvas-wrap').innerHTML =
          '<div class="err-box"><b>Не удалось загрузить библиотеку Three.js.</b><br>Проверьте подключение к интернету или отключите блокировщик рекламы/скриптов.</div>';
        return;
      }
      for (const u of controlsUrls) {
        try { await loadScript(u); if (window.THREE && THREE.OrbitControls) break; } catch (_) {}
      }
      startLab();
    }

    function startLab() {
      const wrap = document.getElementById('canvas-wrap');
      const panel = document.getElementById('info-panel');
      const labelsLayer = document.getElementById('labels-layer');

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070b14);

      const camera = new THREE.PerspectiveCamera(45, Math.max(1, wrap.clientWidth) / Math.max(1, wrap.clientHeight), 0.1, 100);
      camera.position.set(7.5, 4.2, 8.8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      wrap.appendChild(renderer.domElement);

      const controls = THREE.OrbitControls ? new THREE.OrbitControls(camera, renderer.domElement) : null;
      if (controls) {
        controls.enableDamping = true;
        controls.target.set(0.5, 0, 0);
      }

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
      dirLight.position.set(6, 10, 7);
      scene.add(dirLight);

      const grid = new THREE.GridHelper(18, 18, 0x1e293b, 0x0f172a);
      grid.position.y = -2.2;
      scene.add(grid);

      let mode = 'interference';
      let state = { lambda: 532, slitDist: 1.2, analyzerAngle: 45, gratingPeriod: 2.0 };
      let modeGroup = new THREE.Group();
      scene.add(modeGroup);
      let animHooks = [];
      let labelItems = [];

      function clearLabels() {
        labelsLayer.innerHTML = '';
        labelItems = [];
      }

      function addLabel(text, vec3) {
        const el = document.createElement('div');
        el.className = 'label-3d';
        el.textContent = text;
        labelsLayer.appendChild(el);
        labelItems.push({ el, pos: vec3.clone() });
      }

      function updateLabels() {
        const w = wrap.clientWidth;
        const h = wrap.clientHeight;
        labelItems.forEach(({ el, pos }) => {
          const p = pos.clone().project(camera);
          if (p.z > 1) {
            el.style.display = 'none';
            return;
          }
          el.style.display = 'block';
          el.style.left = `${(p.x * 0.5 + 0.5) * w}px`;
          el.style.top = `${(-p.y * 0.5 + 0.5) * h}px`;
        });
      }

      function wavelengthToHex(nm) {
        let r = 0, g = 0, b = 0;
        if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
        else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
        else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
        else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
        else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
        else if (nm <= 750) { r = 1; }
        return (Math.round(r * 255) << 16) + (Math.round(g * 255) << 8) + Math.round(b * 255);
      }

      window.setCam = (x, y, z) => {
        camera.position.set(x, y, z);
        if (controls) { controls.target.set(0.5, 0, 0); controls.update(); }
        else { camera.lookAt(0.5, 0, 0); }
      };

      function clearScene() {
        scene.remove(modeGroup);
        modeGroup = new THREE.Group();
        scene.add(modeGroup);
        animHooks = [];
        clearLabels();
      }

      function buildInterference() {
        clearScene();
        const color = wavelengthToHex(state.lambda);
        const d = state.slitDist;

        // Корпус лазера и конусный когерентный пучок
        const laserBody = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.28, 1.3, 24),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.4 })
        );
        laserBody.rotation.z = Math.PI / 2;
        laserBody.position.set(-4.3, -0.4, 0);
        modeGroup.add(laserBody);

        const beamCone = new THREE.Mesh(
          new THREE.CylinderGeometry(0.12, 1.15, 2.5, 24, 1, true),
          new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false })
        );
        beamCone.rotation.z = Math.PI / 2;
        beamCone.position.set(-2.45, -0.4, 0);
        modeGroup.add(beamCone);

        // Оптическая скамья и экран с двумя щелями S1 и S2
        const bench = new THREE.Mesh(
          new THREE.BoxGeometry(8.6, 0.14, 0.7),
          new THREE.MeshStandardMaterial({ color: 0x111827 })
        );
        bench.position.set(-0.2, -2.05, 0);
        modeGroup.add(bench);

        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
        const topWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, 1.4), wallMat);
        topWall.position.set(-1.2, -0.4, -(d / 2 + 0.85));
        const botWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, 1.4), wallMat);
        botWall.position.set(-1.2, -0.4, (d / 2 + 0.85));
        const midWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, Math.max(0.14, d - 0.22)), wallMat);
        midWall.position.set(-1.2, -0.4, 0);
        modeGroup.add(topWall, botWall, midWall);

        // Расходящиеся волновые фронты от двух щелей
        const rings = [];
        for (const s of [-d / 2, d / 2]) {
          for (let i = 0; i < 8; i++) {
            const ring = new THREE.Mesh(
              new THREE.RingGeometry(0.08, 0.14, 48, 1, -Math.PI / 2.2, Math.PI / 1.1),
              new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.65, depthWrite: false })
            );
            ring.rotation.x = -Math.PI / 2;
            ring.position.set(-1.12, -0.4, s);
            modeGroup.add(ring);
            rings.push({ mesh: ring, offset: i / 8 });
          }
        }

        // Экран с интерференционными полосами
        const canvasTex = document.createElement('canvas');
        canvasTex.width = 256; canvasTex.height = 128;
        const ctx = canvasTex.getContext('2d');
        const hexStr = '#' + color.toString(16).padStart(6, '0');
        ctx.fillStyle = '#070b14';
        ctx.fillRect(0, 0, 256, 128);
        for (let x = 0; x < 256; x++) {
          const u = (x - 128) / 22;
          const intensity = Math.pow(Math.cos(u * d * (532 / state.lambda) * 2.1), 2);
          ctx.globalAlpha = intensity * 0.95;
          ctx.fillStyle = hexStr;
          ctx.fillRect(x, 12, 1, 104);
        }
        ctx.globalAlpha = 1;

        const screen = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 3.3, 4.6),
          new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvasTex) })
        );
        screen.position.set(3.4, -0.4, 0);
        modeGroup.add(screen);

        addLabel('Лазер (когерентный свет)', new THREE.Vector3(-4.2, 0.65, 0));
        addLabel('Две щели S₁ и S₂', new THREE.Vector3(-1.2, 1.55, 0));
        addLabel('Экран (интерференционные полосы)', new THREE.Vector3(3.4, 1.6, 0));

        animHooks.push((t) => {
          const speed = 0.42 * (532 / state.lambda);
          rings.forEach(r => {
            const p = (t * speed + r.offset) % 1;
            const scale = 0.25 + p * 5.2;
            r.mesh.scale.set(scale, scale, 1);
            r.mesh.material.opacity = (1 - p) * 0.72;
          });
        });

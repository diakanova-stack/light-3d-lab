<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЦО 11.6.1.3 • Электромагнитная природа света (3D)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { background: #070b14; color: #f1f5f9; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
    header {
      padding: 10px 16px; background: rgba(12, 19, 34, 0.95); border-bottom: 1px solid #1e293b;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; z-index: 10;
    }
    .title-badge { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .co-tag { background: #0284c7; color: #fff; font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
    header h1 { font-size: 15px; font-weight: 600; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      padding: 6px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b;
      color: #cbd5e1; cursor: pointer; font-size: 13px;
    }
    .tab.active { background: #0284c7; border-color: #38bdf8; color: #fff; font-weight: 600; }
    #canvas-wrap { position: relative; flex: 1; width: 100%; }
    canvas { display: block; width: 100%; height: 100%; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .panel {
      position: absolute; top: 14px; left: 14px; width: 320px; max-width: calc(100vw - 28px);
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155; border-radius: 12px;
      padding: 14px; font-size: 13px; line-height: 1.45; z-index: 5;
    }
    .stage-label { font-size: 11px; text-transform: uppercase; color: #38bdf8; font-weight: 700; margin-bottom: 4px; }
    .panel h2 { font-size: 15px; margin-bottom: 6px; }
    .control { margin-top: 10px; }
    .control label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #cbd5e1; }
    .control input[type="range"] { width: 100%; accent-color: #38bdf8; }
    .formula {
      margin-top: 10px; padding: 8px 10px; background: #090d16; border-left: 3px solid #38bdf8;
      border-radius: 6px; font-family: ui-monospace, monospace; font-size: 12px;
    }
    .conclusion { margin-top: 10px; color: #94a3b8; font-size: 12.5px; }
    .camera-bar {
      position: absolute; bottom: 14px; left: 14px; display: flex; flex-wrap: wrap; gap: 6px;
      background: rgba(15, 23, 42, 0.9); padding: 6px 10px; border-radius: 10px; border: 1px solid #334155; z-index: 5;
    }
    .cam-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #334155; background: #1e293b;
      color: #e2e8f0; font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <div class="title-badge">
      <span class="co-tag">ЦО 11.6.1.3</span>
      <h1>Экспериментальное доказательство электромагнитной природы света</h1>
    </div>
    <div class="tabs">
      <button class="tab active" data-mode="interference">1. Интерференция</button>
      <button class="tab" data-mode="diffraction">2. Дифракция</button>
      <button class="tab" data-mode="polarization">3. Поляризация</button>
      <button class="tab" data-mode="emwave">4. Волна Максвелла</button>
    </div>
  </header>

  <div id="canvas-wrap">
    <div class="panel" id="info-panel">Запуск модели...</div>
    <canvas id="sceneCanvas"></canvas>
    <div class="camera-bar">
      <button class="cam-btn" onclick="setView(0.55, 0.35, 1.0)">3D-перспектива</button>
      <button class="cam-btn" onclick="setView(0.0, 0.08, 1.0)">Вид сбоку</button>
      <button class="cam-btn" onclick="setView(0.0, 1.25, 1.0)">Вид сверху</button>
    </div>
  </div>

  <script>
    const wrap = document.getElementById('canvas-wrap');
    const canvas = document.getElementById('sceneCanvas');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('info-panel');

    let mode = 'interference';
    let state = { lambda: 532, slitDist: 1.2, analyzerAngle: 45, gratingPeriod: 2.0 };
    let yaw = 0.55, pitch = 0.35, zoom = 1.0;
    let dragging = false, lastX = 0, lastY = 0;

    function wavelengthToCss(nm) {
      let r = 0, g = 0, b = 0;
      if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
      else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
      else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
      else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
      else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
      else { r = 1; }
      return `rgb(${Math.round(r * 255)}, ${Math.round(g * 255)}, ${Math.round(b * 255)})`;
    }

    function project(x, y, z, w, h) {
      const cosY = Math.cos(yaw), sinY = Math.sin(yaw);
      const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;
      const y2 = y * cosP - z1 * sinP;
      const z2 = y * sinP + z1 * cosP;
      const scale = (Math.min(w, h) * 0.14 * zoom) / (1 + z2 * 0.08);
      return {
        sx: w * 0.56 + x1 * scale,
        sy: h * 0.52 - y2 * scale
      };
    }

    function draw3DLine(pts, color, width = 2, w, h) {
      if (pts.length < 2) return;
      ctx.beginPath();
      pts.forEach((p, idx) => {
        const pr = project(p[0], p[1], p[2], w, h);
        if (idx === 0) ctx.moveTo(pr.sx, pr.sy);
        else ctx.lineTo(pr.sx, pr.sy);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function renderPanel() {
      if (mode === 'interference') {
        panel.innerHTML = `
          <div class="stage-label">Этап 1 • Волновая природа</div>
          <h2>Интерференция (опыт Юнга)</h2>
          <div>Когерентные волны от двух щелей образуют светлые и тёмные полосы на экране.</div>
          <div class="control">
            <label><span>Длина волны λ</span><b>${state.lambda} нм</b></label>
            <input type="range" min="420" max="680" value="${state.lambda}" oninput="updateParam('lambda', +this.value)">
          </div>
          <div class="control">
            <label><span>Расстояние между щелями d</span><b>${state.slitDist.toFixed(1)} мм</b></label>
            <input type="range" min="0.6" max="2.0" step="0.1" value="${state.slitDist}" oninput="updateParam('slitDist', +this.value)">
          </div>
          <div class="formula">Δx = λ · L / d</div>
          <div class="conclusion"><b>Вывод:</b> Чередование полос доказывает волновую природу света.</div>
        `;
      } else if (mode === 'diffraction') {
        panel.innerHTML = `
          <div class="stage-label">Этап 2 • Измерение длины волны</div>
          <h2>Дифракция на решётке</h2>
          <div>Свет отклоняется на штрихах решётки и даёт максимумы порядков k = 0, ±1, ±2.</div>
          <div class="control">
            <label><span>Длина волны λ</span><b>${state.lambda} нм</b></label>
            <input type="range" min="400" max="700" value="${state.lambda}" oninput="updateParam('lambda', +this.value)">
          </div>
          <div class="control">
            <label><span>Период решётки d</span><b>${state.gratingPeriod.toFixed(1)} мкм</b></label>
            <input type="range" min="1.2" max="3.0" step="0.2" value="${state.gratingPeriod}" oninput="updateParam('gratingPeriod', +this.value)">
          </div>
          <div class="formula">d · sin φ = k · λ</div>
          <div class="conclusion"><b>Вывод:</b> По положению максимумов определяют длину волны.</div>
        `;
      } else if (mode === 'polarization') {
        const rad = (state.analyzerAngle * Math.PI) / 180;
        const iPct = Math.round(Math.pow(Math.cos(rad), 2) * 100);
        panel.innerHTML = `
          <div class="stage-label">Этап 3 • Поперечность волны</div>
          <h2>Поляризация света</h2>
          <div>Поляризатор выделяет колебания в одной плоскости, анализатор поворачивает её на угол α.</div>
          <div class="control">
            <label><span>Угол анализатора α</span><b>${state.analyzerAngle}° (I = ${iPct}%)</b></label>
            <input type="range" min="0" max="180" value="${state.analyzerAngle}" oninput="updateParam('analyzerAngle', +this.value)">
          </div>
          <div class="formula">I = I₀ · cos²(${state.analyzerAngle}°)</div>
          <div class="conclusion"><b>Вывод:</b> Гашение при α = 90° доказывает поперечность волны.</div>
        `;
      } else {
        panel.innerHTML = `
          <div class="stage-label">Этап 4 • Модель Максвелла</div>
          <h2>Электромагнитная волна</h2>
          <div>Взаимно перпендикулярные колебания электрического (<b>E</b>) и магнитного (<b>B</b>) полей.</div>
          <div class="control">
            <label><span>Длина волны λ</span><b>${state.lambda} нм</b></label>
            <input type="range" min="400" max="700" value="${state.lambda}" oninput="updateParam('lambda', +this.value)">
          </div>
          <div class="formula">E ⊥ B ⊥ c,   c ≈ 3 · 10⁸ м/с</div>
          <div class="conclusion"><b>Итог (11.6.1.3):</b> Свет — поперечная электромагнитная волна.</div>
        `;
      }
    }

    function drawFrame(t) {
      const w = wrap.clientWidth, h = wrap.clientHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w; canvas.height = h;
      }
      ctx.clearRect(0, 0, w, h);

      const col = wavelengthToCss(state.lambda);
      draw3DLine([[-4.5, 0, 0], [4.5, 0, 0]], '#334155', 1.5, w, h);

      if (mode === 'interference') {
        const d = state.slitDist;
        for (const s of [-d / 2, d / 2]) {
          for (let rIdx = 0; rIdx < 5; rIdx++) {
            const p = ((t * 0.45 + rIdx / 5) % 1);
            const rad = 0.2 + p * 3.8;
            const pts = [];
            for (let a = -1.1; a <= 1.1; a += 0.15) {
              pts.push([-1.5 + Math.cos(a) * rad, 0, s + Math.sin(a) * rad]);
            }
            draw3DLine(pts, col, 2, w, h);
          }
        }
        for (let i = -8; i <= 8; i++) {
          const zPos = i * 0.22;
          const inten = Math.pow(Math.cos(zPos * d * (532 / state.lambda) * 2.2), 2);
          const p1 = project(3.2, -1.3, zPos, w, h);
          const p2 = project(3.2, 1.3, zPos, w, h);
          ctx.beginPath();
          ctx.moveTo(p1.sx, p1.sy);
          ctx.lineTo(p2.sx, p2.sy);
          ctx.strokeStyle = col;
          ctx.globalAlpha = Math.max(0.05, inten);
          ctx.lineWidth = 4;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      } else if (mode === 'diffraction') {
        draw3DLine([[-4.0, 0, 0], [-1.8, 0, 0]], col, 3, w, h);
        const x1 = 0.85 * (state.lambda / 550) * (2.0 / state.gratingPeriod);
        [-2, -1, 0, 1, 2].forEach(k => {
          draw3DLine([[-1.8, 0, 0], [3.2, 0, k * x1]], col, k === 0 ? 3 : 2, w, h);
        });
      } else if (mode === 'polarization') {
        const rad = (state.analyzerAngle * Math.PI) / 180;
        const ampOut = Math.abs(Math.cos(rad)) * 1.1;
        const pts1 = [], pts2 = [], pts3 = [];
        for (let i = 0; i <= 40; i++) {
          const x = -4.2 + (8.4 * i) / 40;
          const v = Math.sin(t * 4 - x * 2.2);
          if (x < -1.2) pts1.push([x, v * 1.1, Math.cos(t * 4 - x * 2.2 + 1) * 0.7]);
          else if (x < 1.2) pts2.push([x, v * 1.1, 0]);
          else pts3.push([x, v * ampOut * Math.cos(rad), v * ampOut * Math.sin(rad)]);
        }
        draw3DLine(pts1, '#f43f5e', 2, w, h);
        draw3DLine(pts2, '#38bdf8', 2.5, w, h);
        draw3DLine(pts3, '#facc15', 2.5, w, h);
      } else {
        const k = (550 / state.lambda) * 1.5;
        const ePts = [], bPts = [];
        for (let i = 0; i <= 60; i++) {
          const x = -4.2 + (8.4 * i) / 60;
          const val = Math.sin(t * 3.5 - x * k) * 1.2;
          ePts.push([x, val, 0]);
          bPts.push([x, 0, val]);
        }
        draw3DLine(ePts, '#f43f5e', 2.5, w, h);
        draw3DLine(bPts, '#38bdf8', 2.5, w, h);
      }
    }

    window.updateParam = (key, val) => { state[key] = val; renderPanel(); };
    window.setView = (y, p, z) => { yaw = y; pitch = p; zoom = z; };

    canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
    window.addEventListener('mouseup', () => dragging = false);
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      yaw += (e.clientX - lastX) * 0.008;
      pitch = Math.max(-1.2, Math.min(1.2, pitch + (e.clientY - lastY) * 0.008));
      lastX = e.clientX; lastY = e.clientY;
    });

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        renderPanel();
      });
    });

    renderPanel();
    const start = performance.now();
    (function loop(now) {
      drawFrame((now - start) / 1000);
      requestAnimationFrame(loop);
    })(start);
  </script>
</body>
</html>

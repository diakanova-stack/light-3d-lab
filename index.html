<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ЦО 11.6.1.3 • Электромагнитная природа света</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #050811; color: #f1f5f9;
      display: flex; flex-direction: column;
    }

    .top-bar {
      padding: 10px 14px;
      display: flex; flex-wrap: wrap; align-items: stretch; justify-content: space-between; gap: 10px;
      z-index: 10; pointer-events: none;
    }
    .title-card {
      pointer-events: auto;
      background: rgba(10, 17, 32, 0.92); border: 1px solid #1e293b; border-radius: 14px;
      padding: 9px 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .title-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #94a3b8; }
    .co-badge {
      background: #0284c7; color: #fff; font-weight: 700; font-size: 11px;
      padding: 2px 7px; border-radius: 6px; letter-spacing: 0.3px;
    }
    .title-card h1 { font-size: 15px; font-weight: 700; color: #f8fafc; line-height: 1.25; }

    .tabs-card {
      pointer-events: auto;
      background: rgba(10, 17, 32, 0.92); border: 1px solid #1e293b; border-radius: 14px;
      padding: 5px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .tab-btn {
      padding: 8px 13px; border-radius: 10px; border: 1px solid transparent;
      background: transparent; color: #cbd5e1; font-size: 12.5px; font-weight: 600;
      cursor: pointer; transition: 0.18s; text-align: center; line-height: 1.2;
    }
    .tab-btn:hover { background: rgba(30, 41, 59, 0.85); color: #fff; }
    .tab-btn.active {
      background: #0284c7; border-color: #38bdf8; color: #fff;
      box-shadow: 0 0 16px rgba(2, 132, 199, 0.45);
    }

    #stage-wrap { position: relative; flex: 1; width: 100%; min-height: 0; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #labels-layer { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .scene-tag {
      position: absolute; transform: translate(-50%, -50%);
      background: rgba(10, 17, 32, 0.92); border: 1px solid #475569; color: #f8fafc;
      padding: 4px 10px; border-radius: 8px; font-size: 11.5px; font-weight: 600;
      white-space: nowrap; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
    }

    .side-panel {
      position: absolute; top: 6px; left: 14px; width: 336px; max-width: calc(100vw - 28px);
      max-height: calc(100% - 76px); overflow-y: auto;
      background: rgba(10, 17, 32, 0.93); backdrop-filter: blur(10px);
      border: 1px solid #1e293b; border-radius: 16px; padding: 14px;
      z-index: 6; box-shadow: 0 14px 36px rgba(0, 0, 0, 0.6);
    }
    .panel-toggle {
      display: none; width: 100%; align-items: center; justify-content: space-between;
      background: transparent; border: none; color: #38bdf8; font-size: 12px; font-weight: 700;
      cursor: pointer; padding-bottom: 6px;
    }
    .stage-kicker {
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.7px;
      text-transform: uppercase; color: #38bdf8; margin-bottom: 4px;
    }
    .side-panel h2 { font-size: 16.5px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
    .side-desc { font-size: 12.5px; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; }
    .side-desc code { color: #38bdf8; font-family: ui-monospace, SFMono-Regular, monospace; }

    .ctrl-box {
      background: rgba(15, 23, 42, 0.88); border: 1px solid #1e293b;
      border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    }
    .ctrl-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; }
    .ctrl-val {
      background: #0f172a; border: 1px solid #334155; color: #38bdf8;
      padding: 2px 8px; border-radius: 6px; font-weight: 700; font-size: 11.5px; white-space: nowrap;
    }
    input[type="range"] { width: 100%; accent-color: #38bdf8; cursor: pointer; height: 22px; }
    .scale-ticks {
      display: flex; justify-content: space-between; font-size: 10.5px; color: #64748b; margin-top: 3px;
    }

    .formula-box {
      background: rgba(9, 14, 26, 0.95); border-left: 3px solid #38bdf8;
      border-radius: 8px; padding: 8px 11px; font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 11.5px; color: #e2e8f0; margin-top: 6px; line-height: 1.4;
    }

    .bottom-hud {
      position: absolute; bottom: 10px; left: 14px; right: 14px;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
      pointer-events: none; z-index: 6;
    }
    .cam-group, .controls-hint {
      pointer-events: auto;
      background: rgba(10, 17, 32, 0.92); border: 1px solid #1e293b;
      border-radius: 12px; padding: 5px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
      font-size: 11.5px; color: #94a3b8; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .cam-btn {
      padding: 5px 10px; border-radius: 8px; border: 1px solid #334155;
      background: #111827; color: #e2e8f0; font-size: 11.5px; font-weight: 600; cursor: pointer;
    }
    .cam-btn:hover, .cam-btn.active { background: #1e293b; border-color: #38bdf8; color: #fff; }

    @media (max-width: 768px) {
      .top-bar { padding: 8px 10px; gap: 6px; }
      .title-card { padding: 7px 11px; border-radius: 12px; width: 100%; }
      .title-card h1 { font-size: 13px; }
      .tabs-card { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; border-radius: 12px; }
      .tab-btn { padding: 7px 4px; font-size: 11px; border-radius: 8px; }

      .side-panel {
        top: auto; bottom: 54px; left: 10px; right: 10px; width: auto; max-width: none;
        max-height: 46%; padding: 11px 12px; border-radius: 14px;
      }
      .panel-toggle { display: flex; }
      .side-panel.collapsed .panel-body { display: none; }
      .side-panel.collapsed { max-height: none; padding: 8px 12px; }
      .side-panel h2 { font-size: 14.5px; }
      .side-desc { font-size: 12px; margin-bottom: 8px; }
      .ctrl-box { padding: 8px 10px; margin-bottom: 6px; }
      .scene-tag { font-size: 10px; padding: 3px 7px; }

      .bottom-hud { bottom: 8px; left: 10px; right: 10px; }
      .cam-group { width: 100%; justify-content: space-between; padding: 4px 6px; }
      .cam-group > span { display: none; }
      .cam-btn { padding: 5px 7px; font-size: 10.5px; flex: 1; text-align: center; }
      .controls-hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="title-card">
      <div class="title-meta">
        <span class="co-badge">ЦО 11.6.1.3</span>
        <span>Физика • 11 класс</span>
      </div>
      <h1>Экспериментальное доказательство электромагнитной природы света</h1>
    </div>

    <div class="tabs-card">
      <button class="tab-btn active" data-mode="interference">1. Интерференция</button>
      <button class="tab-btn" data-mode="diffraction">2. Дифракция</button>
      <button class="tab-btn" data-mode="polarization">3. Поляризация</button>
      <button class="tab-btn" data-mode="emwave">4. Волна Максвелла</button>
    </div>
  </div>

  <div id="stage-wrap">
    <div class="side-panel" id="panel"></div>
    <div id="labels-layer"></div>

    <div class="bottom-hud">
      <div class="cam-group">
        <span>Камера:</span>
        <button class="cam-btn active" onclick="setCamPreset('persp', this)">3D-вид</button>
        <button class="cam-btn" onclick="setCamPreset('side', this)">Сбоку</button>
        <button class="cam-btn" onclick="setCamPreset('top', this)">Сверху</button>
        <button class="cam-btn" onclick="setCamPreset('screen', this)">На экран</button>
      </div>
      <div class="controls-hint">
        ЛКМ / 1 палец — вращение • Колёсико / щипок — масштаб • ПКМ / 2 пальца — сдвиг
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const wrap = document.getElementById('stage-wrap');
    const panel = document.getElementById('panel');
    const labelsLayer = document.getElementById('labels-layer');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050811);

    const isMobile = () => window.innerWidth <= 768;

    const camera = new THREE.PerspectiveCamera(45, Math.max(1, wrap.clientWidth) / Math.max(1, wrap.clientHeight), 0.1, 100);
    camera.position.set(6.8, 3.8, 8.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    wrap.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0.7, -0.25, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.95);
    dirLight.position.set(6, 10, 7);
    scene.add(dirLight);

    const grid = new THREE.GridHelper(18, 18, 0x1e293b, 0x0d1526);
    grid.position.y = -2.1;
    scene.add(grid);

    let mode = 'interference';
    let panelCollapsed = false;
    const state = {
      lambda: 530,
      slitDist: 1.8,
      gratingPeriod: 2.0,
      analyzerAngle: 45
    };

    let modeGroup = new THREE.Group();
    scene.add(modeGroup);
    let animFn = null;
    let labelsData = [];

    function wavelengthHex(nm) {
      let r = 0, g = 0, b = 0;
      if (nm >= 380 && nm < 440) { r = -(nm - 440) / 60; b = 1; }
      else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
      else if (nm < 510) { g = 1; b = -(nm - 510) / 20; }
      else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
      else if (nm < 645) { r = 1; g = -(nm - 645) / 65; }
      else { r = 1; }
      return (Math.round(r * 255) << 16) + (Math.round(g * 255) << 8) + Math.round(b * 255);
    }

    function setLabels(items) {
      labelsLayer.innerHTML = '';
      labelsData = items.map(({ text, pos }) => {
        const el = document.createElement('div');
        el.className = 'scene-tag';
        el.textContent = text;
        labelsLayer.appendChild(el);
        return { el, vec: new THREE.Vector3(pos[0], pos[1], pos[2]) };
      });
      updateLabelsPos();
    }

    function updateLabelsPos() {
      const w = wrap.clientWidth;
      const h = wrap.clientHeight;
      labelsData.forEach(({ el, vec }) => {
        const p = vec.clone().project(camera);
        if (p.z > 1) {
          el.style.display = 'none';
          return;
        }
        el.style.display = 'block';
        el.style.left = `${(p.x * 0.5 + 0.5) * w}px`;
        el.style.top = `${(-p.y * 0.5 + 0.5) * h}px`;
      });
    }

    function clearGroup() {
      scene.remove(modeGroup);
      modeGroup = new THREE.Group();
      scene.add(modeGroup);
      animFn = null;
    }

    window.togglePanel = () => {
      panelCollapsed = !panelCollapsed;
      panel.classList.toggle('collapsed', panelCollapsed);
      const btn = document.getElementById('panelToggleBtn');
      if (btn) btn.textContent = panelCollapsed ? 'Показать параметры ▲' : 'Свернуть параметры ▼';
    };

    function renderPanel() {
      panel.classList.toggle('collapsed', panelCollapsed);
      const toggleHtml = `<button class="panel-toggle" id="panelToggleBtn" onclick="togglePanel()">${panelCollapsed ? 'Показать параметры ▲' : 'Свернуть параметры ▼'}</button>`;

      if (mode === 'interference') {
        const fringeIndex = ((state.lambda / 530) * (1.8 / state.slitDist)).toFixed(2);
        panel.innerHTML = `
          ${toggleHtml}
          <div class="panel-body">
            <div class="stage-kicker">Этап 1 • Волновая природа</div>
            <h2>Интерференция (опыт Юнга)</h2>
            <p class="side-desc">
              Когерентные волны от щелей <b>S₁</b> и <b>S₂</b> накладываются: где <code>Δr = kλ</code> — максимумы, где <code>Δr = (2k+1)λ/2</code> — минимумы.
            </p>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Длина волны λ</span>
                <span class="ctrl-val">${state.lambda} нм</span>
              </div>
              <input type="range" min="400" max="700" value="${state.lambda}" oninput="setParam('lambda', +this.value)">
              <div class="scale-ticks"><span>400 нм</span><span>550 нм</span><span>700 нм</span></div>
            </div>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Расстояние d</span>
                <span class="ctrl-val">${state.slitDist.toFixed(1)} усл. ед.</span>
              </div>
              <input type="range" min="0.8" max="2.6" step="0.1" value="${state.slitDist}" oninput="setParam('slitDist', +this.value)">
            </div>
            <div class="formula-box">Δx = λ · L / d • Ширина полос: ${fringeIndex}×</div>
          </div>
        `;
      } else if (mode === 'diffraction') {
        const sinPhi1 = Math.min(0.95, (state.lambda * 1e-3) / state.gratingPeriod);
        const deg1 = ((Math.asin(sinPhi1) * 180) / Math.PI).toFixed(1);
        panel.innerHTML = `
          ${toggleHtml}
          <div class="panel-body">
            <div class="stage-kicker">Этап 2 • Измерение длины волны</div>
            <h2>Дифракция на решётке</h2>
            <p class="side-desc">
              Свет отклоняется на штрихах решётки и образует максимумы порядков <code>k = 0, ±1, ±2</code> под углами <code>d·sin φ = kλ</code>.
            </p>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Длина волны λ</span>
                <span class="ctrl-val">${state.lambda} нм</span>
              </div>
              <input type="range" min="400" max="700" value="${state.lambda}" oninput="setParam('lambda', +this.value)">
            </div>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Период решётки d</span>
                <span class="ctrl-val">${state.gratingPeriod.toFixed(1)} мкм</span>
              </div>
              <input type="range" min="1.2" max="3.0" step="0.1" value="${state.gratingPeriod}" oninput="setParam('gratingPeriod', +this.value)">
            </div>
            <div class="formula-box">d · sin φ = k · λ • φ₁ ≈ ${deg1}°</div>
          </div>
        `;
      } else if (mode === 'polarization') {
        const rad = (state.analyzerAngle * Math.PI) / 180;
        const pct = Math.round(Math.pow(Math.cos(rad), 2) * 100);
        panel.innerHTML = `
          ${toggleHtml}
          <div class="panel-body">
            <div class="stage-kicker">Этап 3 • Поперечность волны</div>
            <h2>Поляризация света</h2>
            <p class="side-desc">
              Поляризатор выделяет колебания в одной плоскости, а анализатор пропускает составляющую под углом <code>α</code>.
            </p>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Угол анализатора α</span>
                <span class="ctrl-val">${state.analyzerAngle}° (I = ${pct}%)</span>
              </div>
              <input type="range" min="0" max="180" value="${state.analyzerAngle}" oninput="setParam('analyzerAngle', +this.value)">
            </div>
            <div class="formula-box">Закон Малюса: I = I₀ · cos²(${state.analyzerAngle}°)</div>
          </div>
        `;
      } else {
        panel.innerHTML = `
          ${toggleHtml}
          <div class="panel-body">
            <div class="stage-kicker">Этап 4 • Модель Максвелла</div>
            <h2>Волна Максвелла</h2>
            <p class="side-desc">
              Взаимно перпендикулярные колебания электрического (<code>E</code>) и магнитного (<code>B</code>) полей распространяются со скоростью света.
            </p>
            <div class="ctrl-box">
              <div class="ctrl-top">
                <span>Длина волны λ</span>
                <span class="ctrl-val">${state.lambda} нм</span>
              </div>
              <input type="range" min="400" max="700" value="${state.lambda}" oninput="setParam('lambda', +this.value)">
            </div>
            <div class="formula-box">E ⊥ B ⊥ c,   c ≈ 3 · 10⁸ м/с</div>
          </div>
        `;
      }
    }

    function buildInterference() {
      clearGroup();
      const hex = wavelengthHex(state.lambda);
      const d = state.slitDist;

      const bench = new THREE.Mesh(
        new THREE.BoxGeometry(9.2, 0.14, 0.7),
        new THREE.MeshStandardMaterial({ color: 0x111827 })
      );
      bench.position.set(-0.4, -2.02, 0);
      modeGroup.add(bench);

      const laser = new THREE.Mesh(
        new THREE.CylinderGeometry(0.26, 0.26, 1.35, 20),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.4, roughness: 0.5 })
      );
      laser.rotation.z = Math.PI / 2;
      laser.position.set(-4.3, -0.35, 0);
      modeGroup.add(laser);

      const cone = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 1.15, 2.55, 24, 1, true),
        new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.24, side: THREE.DoubleSide, depthWrite: false })
      );
      cone.rotation.z = Math.PI / 2;
      cone.position.set(-2.4, -0.35, 0);
      modeGroup.add(cone);

      const slitMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
      const halfD = d * 0.45;
      const topWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, 1.6), slitMat);
      topWall.position.set(-1.1, -0.35, -(halfD + 0.92));
      const midWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, Math.max(0.14, halfD * 2 - 0.24)), slitMat);
      midWall.position.set(-1.1, -0.35, 0);
      const botWall = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, 1.6), slitMat);
      botWall.position.set(-1.1, -0.35, halfD + 0.92);
      modeGroup.add(topWall, midWall, botWall);

      for (const sZ of [-halfD, halfD]) {
        const p0 = new THREE.Vector3(-1.05, -0.35, sZ);
        const p1 = new THREE.Vector3(3.43, -0.35, 0);
        const dir = new THREE.Vector3().subVectors(p1, p0);
        const ray = new THREE.Mesh(
          new THREE.CylinderGeometry(0.022, 0.022, dir.length(), 8),
          new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: 0.48 })
        );
        ray.position.copy(p0).add(p1).multiplyScalar(0.5);
        ray.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        modeGroup.add(ray);
      }

      const fronts = [];
      const ringCount = isMobile() ? 6 : 9;
      for (const sZ of [-halfD, halfD]) {
        for (let i = 0; i < ringCount; i++) {
          const arc = new THREE.Mesh(
            new THREE.RingGeometry(0.12, 0.2, 28, 1, -Math.PI / 2.3, Math.PI / 1.15),
            new THREE.MeshBasicMaterial({ color: hex, side: THREE.DoubleSide, transparent: true, opacity: 0.55, depthWrite: false })
          );
          arc.rotation.x = -Math.PI / 2;
          arc.position.set(-1.02, -0.35, sZ);
          modeGroup.add(arc);
          fronts.push({ mesh: arc, phase: i / ringCount });
        }
      }

      const texCanvas = document.createElement('canvas');
      texCanvas.width = 256;
      texCanvas.height = 128;
      const tctx = texCanvas.getContext('2d');
      const hexStr = '#' + hex.toString(16).padStart(6, '0');
      tctx.fillStyle = '#070b14';
      tctx.fillRect(0, 0, 256, 128);
      for (let x = 0; x < 256; x++) {
        const u = (x - 128) / 22;
        const inten = Math.pow(Math.cos(u * d * (530 / state.lambda) * 2.1), 2);
        tctx.globalAlpha = inten * 0.95;
        tctx.fillStyle = hexStr;
        tctx.fillRect(x, 12, 1, 104);
      }
      tctx.globalAlpha = 1;

      const screen = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 3.3, 4.6),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(texCanvas) })
      );
      screen.position.set(3.5, -0.35, 0);
      modeGroup.add(screen);

      setLabels([
        { text: 'Лазер', pos: [-4.2, 0.7, 0] },
        { text: 'Щели S₁, S₂', pos: [-1.1, 1.65, 0] },
        { text: 'Экран (полосы)', pos: [3.5, 1.75, 0] }
      ]);

      animFn = (t) => {
        const spd = 0.42 * (530 / state.lambda);
        fronts.forEach(f => {
          const p = (t * spd + f.phase) % 1;
          const s = 0.25 + p * 5.4;
          f.mesh.scale.set(s, s, 1);
          f.mesh.material.opacity = (1 - p) * 0.65;
        });
      };
    }

    function buildDiffraction() {
      clearGroup();
      const hex = wavelengthHex(state.lambda);

      const bench = new THREE.Mesh(
        new THREE.BoxGeometry(9.2, 0.14, 0.7),
        new THREE.MeshStandardMaterial({ color: 0x111827 })
      );
      bench.position.set(-0.3, -2.05, 0);
      modeGroup.add(bench);

      const laser = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.24, 1.2, 20),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.4, roughness: 0.5 })
      );
      laser.rotation.z = Math.PI / 2;
      laser.position.set(-4.2, -0.3, 0);
      modeGroup.add(laser);

      const grating = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 3.2, 3.4),
        new THREE.MeshStandardMaterial({ color: 0x475569, transparent: true, opacity: 0.78 })
      );
      grating.position.set(-2.0, -0.3, 0);
      modeGroup.add(grating);

      for (let i = -8; i <= 8; i++) {
        const lineMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 2.8, 0.03),
          new THREE.MeshBasicMaterial({ color: 0x94a3b8 })
        );
        lineMesh.position.set(-2.0, -0.3, i * 0.16);
        modeGroup.add(lineMesh);
      }

      const scaleCanvas = document.createElement('canvas');
      scaleCanvas.width = 256;
      scaleCanvas.height = 128;
      const sctx = scaleCanvas.getContext('2d');
      sctx.fillStyle = '#090e1a';
      sctx.fillRect(0, 0, 256, 128);
      sctx.strokeStyle = '#64748b';
      sctx.lineWidth = 1.5;
      sctx.beginPath();
      sctx.moveTo(12, 92);
      sctx.lineTo(244, 92);
      for (let x = 16; x <= 240; x += 14) {
        const major = ((x - 16) / 14) % 4 === 0;
        sctx.moveTo(x, 92);
        sctx.lineTo(x, major ? 76 : 84);
      }
      sctx.stroke();

      const screen = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 3.4, 5.2),
        new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(scaleCanvas) })
      );
      screen.position.set(3.4, -0.3, 0);
      modeGroup.add(screen);

      const inBeam = new THREE.Mesh(
        new THREE.CylinderGeometry(0.07, 0.07, 2.2, 10),
        new THREE.MeshBasicMaterial({ color: hex })
      );
      inBeam.rotation.z = Math.PI / 2;
      inBeam.position.set(-3.1, -0.3, 0);
      modeGroup.add(inBeam);

      const x1 = 0.95 * (state.lambda / 550) * (2.0 / state.gratingPeriod);
      [-2, -1, 0, 1, 2].forEach(k => {
        const zEnd = k * x1;
        if (Math.abs(zEnd) > 2.45) return;
        const p0 = new THREE.Vector3(-2.0, -0.3, 0);
        const p1 = new THREE.Vector3(3.32, -0.3, zEnd);
        const dir = new THREE.Vector3().subVectors(p1, p0);
        const beam = new THREE.Mesh(
          new THREE.CylinderGeometry(k === 0 ? 0.065 : 0.04, k === 0 ? 0.065 : 0.04, dir.length(), 8),
          new THREE.MeshBasicMaterial({ color: hex, transparent: true, opacity: k === 0 ? 0.95 : 0.72 })
        );
        beam.position.copy(p0).add(p1).multiplyScalar(0.5);
        beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
        modeGroup.add(beam);

        const spot = new THREE.Mesh(
          new THREE.SphereGeometry(k === 0 ? 0.15 : 0.11, 12, 12),
          new THREE.MeshBasicMaterial({ color: hex })
        );
        spot.position.copy(p1);
        modeGroup.add(spot);
      });

      setLabels([
        { text: 'Решётка (d)', pos: [-2.0, 1.65, 0] },
        { text: 'Экран со шкалой', pos: [3.4, 1.75, 0] }
      ]);
    }

    function createArrow(color) {
      const group = new THREE.Group();
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.022, 0.022, 1, 6),
        new THREE.MeshBasicMaterial({ color })
      );
      shaft.position.y = 0.5;
      const head = new THREE.Mesh(
        new THREE.ConeGeometry(0.075, 0.2, 8),
        new THREE.MeshBasicMaterial({ color })
      );
      head.position.y = 1.05;
      group.add(shaft, head);
      return group;
    }

    function setArrowVector(arrow, origin, vec) {
      const len = vec.length();
      if (len < 0.03) {
        arrow.visible = false;
        return;
      }
      arrow.visible = true;
      arrow.position.copy(origin);
      const dir = vec.clone().normalize();
      arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const shaftScale = Math.max(0.05, len - 0.18);
      arrow.children[0].scale.set(1, shaftScale, 1);
      arrow.children[0].position.y = shaftScale * 0.5;
      arrow.children[1].position.y = shaftScale + 0.09;
    }

    function makeWaveLine(x0, x1, segs, color) {
      const pts = [];
      for (let i = 0; i <= segs; i++) {
        pts.push(new THREE.Vector3(x0 + ((x1 - x0) * i) / segs, 0, 0));
      }
      const geom = new THREE.BufferGeometry().setFromPoints(pts);
      const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color }));
      return { line, geom, x0, x1, segs };
    }

    function buildPolarization() {
      clearGroup();
      const rad = (state.analyzerAngle * Math.PI) / 180;
      const cosA = Math.cos(rad);
      const inten = cosA * cosA;

      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(8.8, 0.12, 0.65),
        new THREE.MeshStandardMaterial({ color: 0x0f172a })
      );
      rail.position.set(0.3, -1.95, 0);
      modeGroup.add(rail);

      const axis = new THREE.Mesh(
        new THREE.CylinderGeometry(0.015, 0.015, 8.6, 8),
        new THREE.MeshBasicMaterial({ color: 0x475569 })
      );
      axis.rotation.z = Math.PI / 2;
      axis.position.set(0.3, 0, 0);
      modeGroup.add(axis);

      const sourceOuter = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.15, 0.14, 24),
        new THREE.MeshStandardMaterial({ color: 0xca8a04, transparent: true, opacity: 0.35 })
      );
      sourceOuter.rotation.z = Math.PI / 2;
      sourceOuter.position.set(-3.4, 0, 0);
      const sourceCore = new THREE.Mesh(
        new THREE.CircleGeometry(0.85, 24),
        new THREE.MeshBasicMaterial({ color: 0xfef08a })
      );
      sourceCore.rotation.y = Math.PI / 2;
      sourceCore.position.set(-3.32, 0, 0);
      modeGroup.add(sourceOuter, sourceCore);

      const polRing = new THREE.Mesh(
        new THREE.TorusGeometry(1.25, 0.055, 10, 32),
        new THREE.MeshStandardMaterial({ color: 0x38bdf8 })
      );
      polRing.rotation.y = Math.PI / 2;
      polRing.position.set(-1.1, 0, 0);
      const polAxisLine = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.025, 2.4, 8),
        new THREE.MeshBasicMaterial({ color: 0x7dd3fc })
      );
      polAxisLine.position.set(-1.1, 0, 0);
      modeGroup.add(polRing, polAxisLine);

      const anaGroup = new THREE.Group();
      anaGroup.position.set(1.3, 0, 0);
      const anaRing = new THREE.Mesh(
        new THREE.TorusGeometry(1.25, 0.055, 10, 32),
        new THREE.MeshStandardMaterial({ color: 0xf59e0b })
      );
      anaRing.rotation.y = Math.PI / 2;
      const anaAxisLine = new THREE.Mesh(
        new THREE.CylinderGeometry(0.028, 0.028, 2.4, 8),
        new THREE.MeshBasicMaterial({ color: 0xfde047 })
      );
      anaAxisLine.rotation.x = rad;
      anaGroup.add(anaRing, anaAxisLine);
      modeGroup.add(anaGroup);

      const scrFrame = new THREE.Mesh(
        new THREE.CylinderGeometry(1.15, 1.15, 0.16, 24),
        new THREE.MeshStandardMaterial({ color: 0x1e293b })
      );
      scrFrame.rotation.z = Math.PI / 2;
      scrFrame.position.set(3.7, 0, 0);
      const scrFace = new THREE.Mesh(
        new THREE.CircleGeometry(0.95, 24),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color(inten * 0.98, inten * 0.85, inten * 0.35)
        })
      );
      scrFace.rotation.y = -Math.PI / 2;
      scrFace.position.set(3.61, 0, 0);
      modeGroup.add(scrFrame, scrFace);

      const segs = isMobile() ? 24 : 36;
      const n1 = makeWaveLine(-3.2, -1.1, segs, 0xfacc15);
      const n2 = makeWaveLine(-3.2, -1.1, segs, 0xf59e0b);
      const pWave = makeWaveLine(-1.1, 1.3, segs, 0x38bdf8);
      const aWave = makeWaveLine(1.3, 3.55, segs, 0xf59e0b);
      modeGroup.add(n1.line, n2.line, pWave.line, aWave.line);

      const arrowCnt = isMobile() ? 4 : 6;
      const preArrows = [];
      for (let i = 0; i < arrowCnt; i++) {
        const x = -2.95 + i * (2.0 / Math.max(1, arrowCnt - 1));
        const a1 = createArrow(0xfacc15);
        const a2 = createArrow(0xf59e0b);
        modeGroup.add(a1, a2);
        preArrows.push({ x, a1, a2, angle: i * 0.9 });
      }

      const midArrows = [];
      for (let i = 0; i < arrowCnt; i++) {
        const x = -0.85 + i * (2.1 / Math.max(1, arrowCnt - 1));
        const ar = createArrow(0x38bdf8);
        modeGroup.add(ar);
        midArrows.push({ x, ar });
      }

      const postArrows = [];
      for (let i = 0; i < arrowCnt; i++) {
        const x = 1.55 + i * (1.9 / Math.max(1, arrowCnt - 1));
        const ar = createArrow(0xf59e0b);
        modeGroup.add(ar);
        postArrows.push({ x, ar });
      }

      setLabels([
        { text: 'Естественный свет', pos: [-3.3, 1.65, 0] },
        { text: 'Поляризатор (0°)', pos: [-1.1, 1.85, 0] },
        { text: `Анализатор (${state.analyzerAngle}°)`, pos: [1.3, 1.85, 0] },
        { text: 'Экран', pos: [3.7, 1.65, 0] }
      ]);

      animFn = (t) => {
        const k = 2.1;
        const amp = 0.85;
        const ampOut = amp * Math.abs(cosA);

        const p1 = n1.geom.attributes.position;
        const p2 = n2.geom.attributes.position;
        for (let i = 0; i <= n1.segs; i++) {
          const x = n1.x0 + ((n1.x1 - n1.x0) * i) / n1.segs;
          const v1 = Math.sin(t * 4 - x * k) * amp;
          const v2 = Math.cos(t * 4 - x * k + 0.7) * amp;
          p1.setXYZ(i, x, v1 * 0.85, v1 * 0.52);
          p2.setXYZ(i, x, -v2 * 0.5, v2 * 0.86);
        }
        p1.needsUpdate = true;
        p2.needsUpdate = true;

        preArrows.forEach(({ x, a1, a2, angle }) => {
          const v1 = Math.sin(t * 4 - x * k) * amp;
          const v2 = Math.cos(t * 4 - x * k + 0.7) * amp;
          setArrowVector(a1, new THREE.Vector3(x, 0, 0), new THREE.Vector3(0, v1 * Math.cos(angle), v1 * Math.sin(angle)));
          setArrowVector(a2, new THREE.Vector3(x, 0, 0), new THREE.Vector3(0, v2 * Math.cos(angle + 1.1), v2 * Math.sin(angle + 1.1)));
        });

        const pm = pWave.geom.attributes.position;
        for (let i = 0; i <= pWave.segs; i++) {
          const x = pWave.x0 + ((pWave.x1 - pWave.x0) * i) / pWave.segs;
          pm.setXYZ(i, x, Math.sin(t * 4 - x * k) * amp, 0);
        }
        pm.needsUpdate = true;

        midArrows.forEach(({ x, ar }) => {
          const v = Math.sin(t * 4 - x * k) * amp;
          setArrowVector(ar, new THREE.Vector3(x, 0, 0), new THREE.Vector3(0, v, 0));
        });

        const pa = aWave.geom.attributes.position;
        const cA = Math.cos(rad), sA = Math.sin(rad);
        for (let i = 0; i <= aWave.segs; i++) {
          const x = aWave.x0 + ((aWave.x1 - aWave.x0) * i) / aWave.segs;
          const v = Math.sin(t * 4 - x * k) * ampOut;
          pa.setXYZ(i, x, v * cA, v * sA);
        }
        pa.needsUpdate = true;

        postArrows.forEach(({ x, ar }) => {
          const v = Math.sin(t * 4 - x * k) * ampOut;
          setArrowVector(ar, new THREE.Vector3(x, 0, 0), new THREE.Vector3(0, v * cA, v * sA));
        });
      };
    }

    function buildEMWave() {
      clearGroup();
      const axis = new THREE.Mesh(
        new THREE.CylinderGeometry(0.022, 0.022, 9.4, 8),
        new THREE.MeshBasicMaterial({ color: 0x64748b })
      );
      axis.rotation.z = Math.PI / 2;
      modeGroup.add(axis);

      const segs = isMobile() ? 64 : 96;
      const eLine = makeWaveLine(-4.5, 4.5, segs, 0xf43f5e);
      const bLine = makeWaveLine(-4.5, 4.5, segs, 0x38bdf8);
      modeGroup.add(eLine.line, bLine.line);

      const count = isMobile() ? 14 : 20;
      const eBars = [], bBars = [];
      for (let i = 0; i < count; i++) {
        const x = -4.4 + (i / (count - 1)) * 8.8;
        const eb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 6), new THREE.MeshBasicMaterial({ color: 0xf43f5e }));
        const bb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1, 6), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        bb.rotation.x = Math.PI / 2;
        modeGroup.add(eb, bb);
        eBars.push({ m: eb, x });
        bBars.push({ m: bb, x });
      }

      setLabels([
        { text: 'Вектор E', pos: [-2.0, 1.75, 0] },
        { text: 'Вектор B', pos: [1.8, 0.35, 1.65] }
      ]);

      animFn = (t) => {
        const k = (550 / state.lambda) * 1.4, amp = 1.45;
        const ep = eLine.geom.attributes.position, bp = bLine.geom.attributes.position;
        for (let i = 0; i <= segs; i++) {
          const x = -4.5 + (9.0 * i) / segs;
          const v = Math.sin(t * 3.5 - x * k) * amp;
          ep.setXYZ(i, x, v, 0);
          bp.setXYZ(i, x, 0, v);
        }
        ep.needsUpdate = true;
        bp.needsUpdate = true;

        for (let i = 0; i < count; i++) {
          const v = Math.sin(t * 3.5 - eBars[i].x * k) * amp;
          eBars[i].m.scale.y = Math.max(0.02, Math.abs(v));
          eBars[i].m.position.set(eBars[i].x, v / 2, 0);
          bBars[i].m.scale.y = Math.max(0.02, Math.abs(v));
          bBars[i].m.position.set(bBars[i].x, 0, v / 2);
        }
      };
    }

    function rebuildStage() {
      renderPanel();
      if (mode === 'interference') buildInterference();
      else if (mode === 'diffraction') buildDiffraction();
      else if (mode === 'polarization') buildPolarization();
      else buildEMWave();
    }

    window.setParam = (key, val) => {
      state[key] = val;
      rebuildStage();
    };

    function applyCameraDistance(basePos) {
      const factor = isMobile() ? 1.32 : 1.0;
      camera.position.set(basePos[0] * factor, basePos[1] * factor, basePos[2] * factor);
    }

    window.setCamPreset = (preset, btn) => {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      controls.target.set(0.7, -0.25, 0);
      if (preset === 'persp') applyCameraDistance([6.8, 3.8, 8.8]);
      else if (preset === 'side') applyCameraDistance([0.3, 0.4, 10.5]);
      else if (preset === 'top') applyCameraDistance([0.5, 11.5, 0.1]);
      else if (preset === 'screen') applyCameraDistance([9.2, 0.4, 0]);
      controls.update();
      updateLabelsPos();
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        rebuildStage();
      });
    });

    controls.addEventListener('change', updateLabelsPos);

    function handleResize() {
      camera.aspect = Math.max(1, wrap.clientWidth) / Math.max(1, wrap.clientHeight);
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
      updateLabelsPos();
    }

    window.addEventListener('resize', handleResize);

    applyCameraDistance([6.8, 3.8, 8.8]);
    rebuildStage();

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (animFn) animFn(t);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
